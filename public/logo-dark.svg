<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&amp;display=swap');
      .brand-text {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 78px;
        letter-spacing: 0.38em;
        fill: #5C58FA;
      }
    </style>
  </defs>

  <!-- Group containing Arabic Wordmark Artwork (Vertically & Horizontally Balanced) -->
  <g transform="translate(10, 30)">
    <!-- 3 Speed Lines on Left -->
    <rect x="50" y="310" width="46" height="18" rx="9" fill="#5C58FA" />
    <rect x="25" y="348" width="70" height="20" rx="10" fill="#5C58FA" />
    <rect x="50" y="388" width="46" height="18" rx="9" fill="#5C58FA" />

    <!-- Two Dots above the Purple Badge -->
    <circle cx="180" cy="210" r="28" fill="#5C58FA" />
    <circle cx="240" cy="210" r="28" fill="#5C58FA" />

    <!-- Main Purple Badge (Taa Marbuta / Rocket Shield) -->
    <path d="M 112 250 
             C 112 238, 122 228, 134 228 
             L 236 228 
             C 285 228, 320 262, 320 310 
             L 320 435 
             L 134 435 
             C 122 435, 112 425, 112 413 
             Z" 
          fill="#5C58FA" />

    <!-- Inner Crisp White Container inside the Badge -->
    <path d="M 156 272 
             C 156 268, 160 264, 165 264 
             L 230 264 
             C 260 264, 275 285, 275 315 
             L 275 365 
             C 275 370, 270 375, 265 375 
             L 165 375 
             C 160 375, 156 370, 156 365 
             Z" 
          fill="#FFFFFF" />

    <!-- Purple Checkmark inside the White Container -->
    <path d="M 178 322 L 204 348 L 254 290" 
          fill="none" 
          stroke="#5C58FA" 
          stroke-width="19" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Middle Letter Faa (فـ) Body & Connecting Stem -->
    <path d="M 320 385 
             L 400 385 
             L 400 340 
             C 400 280, 436 242, 495 242 
             C 555 242, 584 282, 584 340 
             L 584 385 
             L 600 385 
             C 610 385, 616 392, 616 402 
             C 616 412, 610 435, 600 435 
             L 320 435 
             Z" 
          fill="#FFFFFF" />

    <!-- Faa Inner Eye (Cutout) -->
    <path d="M 445 342 
             C 445 306, 465 282, 493 282 
             C 521 282, 536 306, 536 342 
             L 536 385 
             L 445 385 
             Z" 
          fill="#0b0f19" />

    <!-- Faa Dot (above the loop) -->
    <circle cx="493" cy="226" r="28" fill="#FFFFFF" />

    <!-- Right Letter Dal (د) -->
    <path d="M 598 270 
             C 598 258, 606 250, 618 250 
             L 692 250 
             C 740 250, 765 282, 765 328 
             C 765 374, 740 435, 692 435 
             L 618 435 
             C 606 435, 598 427, 598 415 
             C 598 403, 606 395, 618 395 
             L 680 395 
             C 704 395, 718 375, 718 348 
             C 718 321, 704 290, 680 290 
             L 618 290 
             C 606 290, 598 282, 598 270 
             Z" 
          fill="#FFFFFF" />

    <!-- 3 Purple Dots along the outer curve of Dal (د) -->
    <circle cx="740" cy="296" r="11" fill="#5C58FA" />
    <circle cx="751" cy="336" r="11" fill="#5C58FA" />
    <circle cx="740" cy="376" r="11" fill="#5C58FA" />
  </g>

  <!-- English Text D E F F A (Centered underneath) -->
  <text x="430" y="610" text-anchor="middle" class="brand-text">DEFFA</text>
</svg>